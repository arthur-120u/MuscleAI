<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuscleAI</title>
<style>body{font-family:Arial;background:#101114;color:#eee;margin:0}main{max-width:700px;margin:25px auto;padding:20px}.card{background:#1b1d21;padding:22px;border-radius:15px;margin-bottom:15px}label{display:block;margin-top:12px}select,input{width:100%;padding:11px;box-sizing:border-box;margin-top:5px;background:#111;color:#fff;border:1px solid #555;border-radius:7px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:7px;background:#29456b;color:white;font-weight:bold}#r{white-space:pre-wrap;line-height:1.5}</style></head><body><main>
<div class="card"><h1>MuscleAI</h1><p>Assistente inteligente para uma sugestão inicial de treinamento.</p><small>Protótipo acadêmico. Não substitui avaliação profissional.</small></div>
<div class="card"><label>Objetivo</label><select id="g"><option>Hipertrofia</option><option>Força</option><option>Manutenção</option></select>
<label>Nível</label><select id="l"><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select>
<label>Treinos por semana</label><input id="d" type="number" value="4" min="1" max="7">
<label>Tempo por sessão (min)</label><input id="t" type="number" value="60" min="20" max="180">
<button onclick="go()">Gerar sugestão</button></div>
<div class="card"><h2>Resultado</h2><div id="r">Preencha os dados e gere uma sugestão.</div></div>
<script>function go(){let g=document.getElementById('g').value,l=document.getElementById('l').value,d=+document.getElementById('d').value,t=+document.getElementById('t').value;let split=d>=4?'Upper/Lower (alternado)':'Full Body';let reps=g==='Força'?'3–6':'6–15';let rir=l==='Iniciante'?'2–3':'1–3';let rest=g==='Força'?'2–4 min':'1,5–3 min';document.getElementById('r').textContent=`Objetivo: ${g}\nNível: ${l}\nFrequência: ${d}x/semana\nTempo: ${t} min\n\nDivisão sugerida: ${split}\nRepetições: ${reps}\nRIR: ${rir}\nDescanso: ${rest}\n\nProgressão: ao atingir o topo da faixa mantendo técnica e RIR planejado, aumentar a carga gradualmente.\n\nAviso: esta é uma sugestão educacional e não substitui avaliação individualizada.`}</script></main></body></html>
